config:
  validation: true

style:
  # handled by ktlint
  MaxLineLength:
    active: false
  ModifierOrder:
    active: false

  # No need for this
  ReturnCount:
    active: false
  ThrowsCount:
    active: false

empty-blocks:
  # An empty override is how a listener says it isn't interested in an event
  EmptyFunctionBlock:
    ignoreOverridden: true

# Enforce some proper documentation standards (cf. MODELIX-794)
comments:
  OutdatedDocumentation:
    active: true
  UndocumentedPublicClass:
    active: true
  UndocumentedPublicFunction:
    active: true
  UndocumentedPublicProperty:
    active: true

# Try to enforce good handling of nullability
potential-bugs:
  CastNullableToNonNullableType:
    active: true
